name: Android CI

# 触发条件：推到 main/master、提 PR，或在网页上手动触发
on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: 构建 Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 定位工程目录
        run: |
          if [ -f "gradlew" ]; then
            echo "PROJECT_DIR=." >> "$GITHUB_ENV"
            echo "工程位于仓库根目录"
          else
            FOUND=$(find . -maxdepth 3 -name "gradlew" -not -path "./.git/*" | head -n 1)
            if [ -z "$FOUND" ]; then
              echo "::error::仓库中找不到 gradlew 文件，请确认已完整 push 工程（仓库中应包含 gradlew、settings.gradle 和 app/ 目录）"
              echo "当前仓库结构如下："
              find . -maxdepth 2 -not -path "./.git*" | sort
              exit 1
            fi
            DIR=$(dirname "$FOUND")
            echo "PROJECT_DIR=$DIR" >> "$GITHUB_ENV"
            echo "工程位于子目录：$DIR"
          fi

      - name: 配置 JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 配置 Gradle（含依赖缓存，加速后续构建）
        uses: gradle/actions/setup-gradle@v3

      - name: 安装 Android SDK 组件
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0" "platform-tools"

      - name: 构建 Debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: 运行单元测试
        working-directory: ${{ env.PROJECT_DIR }}
        run: ./gradlew testDebugUnitTest

      - name: 上传 APK 产物
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
